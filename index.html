<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Trip Matcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300;1,500&display=swap">
<style>
/* Layout: single centered card that steps through questions, ending in a boarding-pass style result */
:root{
  --bg:#FFEFE3; --paper:#FFF8F2; --ink:#2E2A24; --muted:#6F675C; --line:#E8D6C6;
  --sage:#94A372; --sage-deep:#6E7D50; --sage-soft:#E7ECD9; --onSage:#FFFFFF;
  --display:"Cormorant Garamond", Garamond, "Times New Roman", serif;
  --body:Helvetica, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1C18; --paper:#28251F; --ink:#F3EADF; --muted:#B5AA9B; --line:#3D382F;
  --sage:#A9B888; --sage-deep:#C3D0A4; --sage-soft:#34392A; --onSage:#1E1C18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1C18; --paper:#28251F; --ink:#F3EADF; --muted:#B5AA9B; --line:#3D382F;
  --sage:#A9B888; --sage-deep:#C3D0A4; --sage-soft:#34392A; --onSage:#1E1C18; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding:24px 16px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-deep);font-weight:700}
h1,h2,h3{font-family:var(--display);font-weight:300;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(34px,7vw,52px)}
h1 em{font-style:italic;color:var(--sage-deep)}
h2{font-size:clamp(28px,5.5vw,38px)}
h3{font-size:24px;font-weight:500}
p{margin:0}
.lede{color:var(--muted);max-width:56ch}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,32px);display:flex;flex-direction:column;gap:20px}
.progress{display:flex;gap:6px}
.progress span{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .3s}
.progress span.on{background:var(--sage)}
.stepnum{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}

.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg);display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s;min-width:0}
.opt:hover{border-color:var(--sage)}
.opt:focus-visible{outline:2px solid var(--sage-deep);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--sage-deep);background:var(--sage-soft)}
.opt b{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.2}
.opt small{font-size:13px;color:var(--muted)}

select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;width:100%}
select:focus-visible,input:focus-visible{outline:2px solid var(--sage-deep);outline-offset:1px;border-color:var(--sage)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;letter-spacing:.04em}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sage);color:var(--onSage);font-weight:700;padding:13px 22px;border-radius:999px;text-align:center;font-size:15px}
.btn:hover{background:var(--sage-deep)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--sage)}
.link{all:unset;cursor:pointer;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* Boarding pass */
.pass{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pass-top{background:var(--sage);color:var(--onSage);padding:12px 22px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;gap:12px;flex-wrap:wrap}
.pass-main{padding:22px;display:flex;flex-direction:column;gap:18px}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.code{font-family:var(--display);font-size:clamp(40px,10vw,60px);font-weight:500;line-height:1}
.code small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:400;margin-top:4px}
.dash{border-top:1px dashed var(--muted);position:relative;height:0}
.dash i{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--paper);padding:0 8px;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;border-top:1px solid var(--line);padding-top:16px}
.fields div{display:flex;flex-direction:column;gap:2px;min-width:0}
.fields span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fields b{font-size:15px;font-variant-numeric:tabular-nums}
.why{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.why li{padding-left:18px;position:relative}
.why li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--sage)}
.flag{background:var(--sage-soft);border-radius:8px;padding:12px 14px;font-size:14px}
.flag b{color:var(--sage-deep)}

.hotels{display:flex;flex-direction:column;gap:10px}
.hotel{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.hotel:first-child{border-top:0}
.hotel b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.hotel .tier{font-family:var(--mono);font-size:13px;color:var(--sage-deep);align-self:center;white-space:nowrap}
.hotel small{grid-column:1/-1;color:var(--muted);font-size:13px}
.locked{position:relative}
.locked .hotels{filter:blur(6px);user-select:none;pointer-events:none}
.gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px}
.gate div{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700}

.runners{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.runner{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.runner .mini{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.perknote{background:var(--sage);color:var(--onSage);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.perknote h3{font-size:26px;font-weight:600}
.perknote p{font-size:15px}
.perknote .btn{background:var(--paper);color:var(--ink);align-self:flex-start}
.perknote .btn:hover{background:var(--bg)}
.runner.featured{border:2px solid var(--sage);box-shadow:0 0 0 4px var(--sage-soft)}
.runner.pulse{animation:pulse 1.4s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 10px var(--sage-soft)}}
.ctas .btn{flex:1 1 220px}
.err{color:#B4462F;font-size:13px}
.fine{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

</head>

</div>

const AIRPORTS=AP_RAW.split(";").map(r=>{const p=r.split("|");return{code:p[0],city:p[1],reg:p[2],cc:p[3],lat:+p[4],lon:+p[5],land:p[6],big:p[7]==="1",name:p[8]};});
const AP_BY={};AIRPORTS.forEach(a=>AP_BY[a.code]=a);
let regionNames=null;try{regionNames=new Intl.DisplayNames(["en"],{type:"region"});}catch(_){}
const country=cc=>{try{return regionNames?regionNames.of(cc):cc;}catch(_){return cc;}};
const norm=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function apLabel(a){return a.city+(a.reg?", "+a.reg:"")+(a.cc==="US"?"":" · "+country(a.cc));}
function searchAirports(q){
 q=norm(q.trim());if(q.length<2)return[];
 const out=[];
 for(const a of AIRPORTS){
  const c=a.code.toLowerCase(),city=norm(a.city),nm=norm(a.name);let s=0;
  if(c===q)s=100;else if(city===q)s=60;else if(city.startsWith(q))s=50;
  else if(city.split(/[\s,()-]+/).some(w=>w.startsWith(q)))s=40;else if(nm.includes(q))s=25;
  else if(q.length>3&&norm(country(a.cc)).startsWith(q))s=10;
  if(s){out.push([s+(a.big?8:0),a]);}
 }
 return out.sort((x,y)=>y[0]-x[0]).slice(0,7).map(x=>x[1]);
}

function km(a1,o1,a2,o2){const r=Math.PI/180,dl=(a2-a1)*r,dn=(o2-o1)*r;const x=Math.sin(dl/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(x));}
function flightHrs(k){return Math.max(1,k/800+0.6);}
function driveHrs(k){return k*1.3/80;}
function fmtHrs(h){if(h<0.75)return"Under 1 hr";if(h<1.5)return"About 1 hr";const r=Math.round(h*2)/2;return"About "+(r%1?r:r.toFixed(0))+" hrs";}

/* Hotels a family can actually book: never adults-only */
function familyOk(d){return d.h.filter(h=>!h[2].includes("o"));}

/* In-budget hotels: the chosen tier and the one just below it, never above */
function eligible(d,a){
 const b=+a.budget,hs=a.who==="family"?familyOk(d):d.h;
 let e=hs.filter(h=>h[1]<=b&&h[1]>=Math.max(1,b-1));
 if(e.length<2)e=hs.filter(h=>h[1]<=b);
 return e;
}
/* Must-haves that are about the hotel itself */
function hotelMusts(a){
 const r=[],m=a.must,fam=a.who==="family";
 if(m.includes("ai"))r.push("a");
 if(m.includes("adults")&&!fam)r.push("o");
 if(m.includes("kids")&&fam)r.push("k");
 if(m.includes("spa"))r.push("s");
 if(m.includes("pet")&&a.mode!=="fly")r.push("p");
 return r;
}
function pickHotels(d,a){
 const b=+a.budget,fam=a.who==="family",req=hotelMusts(a);
 const e=eligible(d,a),full=e.filter(h=>req.every(f=>h[2].includes(f)));
 const hs=(full.length>=2?full:e).slice();
 const fit=h=>req.filter(f=>h[2].includes(f)).length;
 const cost=h=>(b-h[1])+(fam&&!h[2].includes("f")?0.5:0)-fit(h)*2;
 hs.sort((x,y)=>cost(x)-cost(y));
 return hs.slice(0,3);
}

function score(d,a,home){
 let s=0;const why=[];const m=+a.month;
 if(d.g.includes(m)){s+=4;why.push(MONTHS[m-1]+" is one of the best months to go.");}
 else if(d.x.includes(m)){s-=7;}
 else s+=1;
 const hit=a.vibe.filter(v=>d.v.includes(v));
 s+=hit.length*4; if(a.vibe.length&&!hit.length)s-=5;
 const vibeWords={beach:"beach time",food:"food and drink",adventure:"adventure",culture:"culture",cozy:"cozy scenery",romance:"romance"};
 if(hit.length)why.push("Strong on "+hit.map(v=>vibeWords[v]).join(" and ")+".");
 if(a.who==="honeymoon"&&d.v.includes("romance")){s+=3;why.push("A proven honeymoon and anniversary pick.");}
 if(a.who==="couple"&&d.v.includes("romance"))s+=1;
 if(a.who==="family"){s+=(d.fam*2)-3;if(!familyOk(d).length)s-=20;if(d.fam===2)why.push("Genuinely easy with kids.");}
 if(a.who==="friends"&&(d.v.includes("food")||d.v.includes("adventure")))s+=1;
 if(a.who==="solo"&&(d.walk||d.v.includes("culture")))s+=1;
 const k=km(home.lat,home.lon,d.lat,d.lon),fh=flightHrs(k),dh=driveHrs(k);
 const drivable=home.land===d.land&&dh<=14&&k>=60;
 let mode;
 if(a.mode==="drive"){if(drivable)mode="drive";else{mode="fly";s-=40;}}
 else if(a.mode==="fly"){mode="fly";if(k<250)s-=2;}
 else mode=(drivable&&dh<=5)?"drive":"fly";
 const h=mode==="drive"?dh:fh;
 if(k<60)s-=10;
 const L=mode==="drive"?{close:3,lo:2.5,hi:6.5,far:5.5}:{close:4,lo:3.5,hi:9,far:7};
 if(a.dist==="close"){if(h<=L.close)s+=3;else s-=(h-L.close)*1.6;}
 if(a.dist==="mid"){if(h>=L.lo&&h<=L.hi)s+=3;else s-=2;}
 if(a.dist==="far"){if(h>=L.far)s+=3;else s-=1;}
 if(mode==="drive")why.push("About "+fmtHrs(h).replace("About ","").replace("Under ","under ")+" by car from "+home.city+". No flights needed.");
 else if(a.dist==="close"&&h<=L.close)why.push("Short flight from "+home.city+".");
 /* Only hotels inside the chosen nightly budget count. A destination needs at least 2. */
 const e=eligible(d,a),req=hotelMusts(a),full=e.filter(h=>req.every(f=>h[2].includes(f)));
 if(e.length<2)s-=30;else s+=3;
 if(req.length){if(full.length>=2)s+=2;else if(full.length===1)s-=4;else s-=10;}
 const flags=e.map(x=>x[2]).join("");
 if(a.must.includes("ai")){if(flags.includes("a")){s+=3;why.push("All-inclusive options available.");}else s-=8;}
 if(a.who!=="family"&&a.must.includes("adults")){if(flags.includes("o"))s+=2;else s-=3;}
 if(a.must.includes("walk")){if(d.walk){s+=3;why.push("Easy to explore on foot.");}else s-=5;}
 if(a.must.includes("kids")&&a.who==="family"){if(flags.includes("k")){s+=3;why.push("Hotels with real kids' clubs.");}else s-=4;}
 if(a.must.includes("spa")){if(flags.includes("s"))s+=2;else s-=5;}
 if(a.must.includes("pet")&&a.mode!=="fly"){if(flags.includes("p")){s+=3;why.push("Dog-friendly hotels on the list.");}else s-=8;}
 if(a.must.includes("easy")&&d.steep)s-=8;
 const warn=(d.warn.length&&d.warn[0].includes(m))?d.warn[1]:"";
 return {d,s,why:why.slice(0,3),hrs:h,km:k,mode,drivable,warn,overBudget:e.length<2};
}

  else{a[st.k]=v;render();setTimeout(()=>{if(S.step<STEPS.length-1&&STEPS[S.step]===st&&st.k!=="budget"){S.step++;render();}},220);}
 });

  c.classList.remove("pulse");void c.offsetWidth;c.classList.add("pulse");};
 document.getElementById("again").onclick=()=>{S.step=-1;S.unlocked=false;S.a={home:a.home,mode:"",who:"",month:"",vibe:[],budget:"",nights:"5",dist:"",must:[]};render();};
 document.getElementById("edit").onclick=()=>{S.step=0;render();};
 const f=document.getElementById("lead");
 if(f)f.onsubmit=async e=>{
  e.preventDefault();
  const fn=document.getElementById("fn").value.trim(),em=document.getElementById("em").value.trim(),ph=document.getElementById("ph").value.trim();
  const err=document.getElementById("err");
  if(!fn||!/^\S+@\S+\.\S+$/.test(em)){err.textContent="Add your first name and a valid email so I can send your match.";err.hidden=false;return;}
  const hp=document.getElementById("website");
  if(hp&&hp.value){S.unlocked=true;renderResult();return;} /* bot filled the hidden field: show results, send nothing */
  const lead={name:fn,email:em,phone:ph,from:apLabel(home)+" ("+home.code+")",getting_there:a.mode,travelers:a.who,month:MONTHS[+a.month-1],nights:a.nights,vibe:a.vibe.join(", "),
    budget:TIERS[a.budget],distance:a.dist,must_haves:a.must.join(", "),top_match:top.d.n,runner_ups:run.map(r=>r.d.n).join(", "),
    hotels_shown:pickHotels(top.d,a).map(h=>h[0]).join(", "),subscribed_to_emails:"yes",consent_text:CONSENT};
  /* Hand the lead to the Wix page this quiz is embedded in (Wix code saves it as a contact) */
  try{if(window.parent!==window)window.parent.postMessage({type:"trip-matcher-lead",lead},"*");}catch(_){}
  if(LEAD_ENDPOINT){
   try{await fetch(LEAD_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(lead)});}catch(_){}
  }
  S.unlocked=true;renderResult();
  const pn=document.getElementById("perknote");if(pn)pn.scrollIntoView({block:"center"});
 };
}
render();
</script>
